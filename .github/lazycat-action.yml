version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/super-productivity.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: super-productivity
build:
  run_buildscript: false
images:
  # 主应用：上游有完整三段 SemVer tag（v7.x~v19.x），排除 latest 等别名
  - id: super-productivity
    target: service
    service: super-productivity
    source: johannesjo/super-productivity
    channel: stable
    sort: semver
    tag_regex: '^v\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: Super Productivity
    summary: "一款集成了时间盒与时间追踪功能的高级待办清单应用"
